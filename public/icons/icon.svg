<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02081d"/>
      <stop offset="50%" stop-color="#000f50"/>
      <stop offset="100%" stop-color="#010617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>
  
  <!-- Inner circular decorative glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 15" stroke-opacity="0.3"/>

  <!-- Crown / Royal Crest Silhouette -->
  <g transform="translate(106, 120) scale(0.58)">
    <!-- Crown Base -->
    <path d="M50 360 L462 360 L440 410 L72 410 Z" fill="url(#goldGrad)" />
    
    <!-- Crown Peaks -->
    <path d="M50 340 L80 180 L180 270 L256 100 L332 270 L432 180 L462 340 Z" fill="url(#goldGrad)" />
    
    <!-- Crown Jewels / Orbs -->
    <circle cx="80" cy="160" r="22" fill="#ffffff" filter="drop-shadow(0 0 8px #f59e0b)"/>
    <circle cx="256" cy="75" r="28" fill="#ffffff" filter="drop-shadow(0 0 10px #f59e0b)"/>
    <circle cx="432" cy="160" r="22" fill="#ffffff" filter="drop-shadow(0 0 8px #f59e0b)"/>

    <!-- Bottom Jewels -->
    <circle cx="150" cy="385" r="12" fill="#000f50"/>
    <circle cx="256" cy="385" r="14" fill="#000f50"/>
    <circle cx="362" cy="385" r="12" fill="#000f50"/>
  </g>

  <!-- Typography: TRP / The Royal Palette -->
  <text x="256" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="8">ROYAL POS</text>
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#fbbf24" letter-spacing="4">THE ROYAL PALETTE</text>
</svg>
